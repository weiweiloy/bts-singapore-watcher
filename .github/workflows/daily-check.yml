name: Daily BTS Tour Page Snapshot

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  fetch-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Run fetch script
        run: python scripts/fetch_announcements.py

      - name: Commit and push if there's a new snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily snapshot: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Check for relevant changes and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
        run: python scripts/check_and_notify.py
